<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Me — Journal (Mockup)</title>
<style>
  :root {
    --color-canvas: #fbf8f6;
    --color-surface: #ffffff;
    --color-ink: #362e38;
    --color-accent: #8b6ba8;
    --color-border: #e4d9e3;
    --color-surface-alt: color-mix(in srgb, var(--color-surface) 85%, var(--color-accent) 15%);
    --color-ink-muted: color-mix(in srgb, var(--color-ink) 60%, var(--color-canvas) 40%);
    --color-accent-soft: color-mix(in srgb, var(--color-accent) 18%, var(--color-surface) 82%);
    --color-accent-contrast: color-mix(in srgb, var(--color-surface) 92%, white 8%);
    --color-radius: 12px;
    --color-radius-sm: 6px;
    --color-shadow: none;
  }
  * { box-sizing: border-box; }
  :root[data-retro="true"] {
    --color-radius: 0px;
    --color-radius-sm: 0px;
    --color-shadow: 3px 3px 0 var(--color-border);
  }
  body {
    margin: 0; background: var(--color-canvas); color: var(--color-ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  :root[data-retro="true"] body { font-family: ui-monospace, "Courier New", monospace; }

  .app {
    max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 3rem;
    display: flex; flex-direction: column; gap: 1.1rem;
  }

  /* ---- Header: date+calendar / search / save ---- */
  .journal-header {
    display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
  }
  /* On desktop this wrapper is invisible to layout (its children act as
     direct flex items of .journal-header) — mobile turns it into its own
     full-width row so search+save land together on one line under the
     date row, instead of wrapping wherever they individually happen to fit. */
  .journal-header-row2 { display: contents; }
  .date-cal-btn {
    display: flex; align-items: center; gap: 0.5rem; border: 1px solid var(--color-border);
    background: var(--color-surface); border-radius: var(--color-radius-sm); padding: 0.4rem 0.65rem;
    cursor: pointer; flex-shrink: 0;
  }
  .date-cal-btn:hover { background: var(--color-surface-alt); }
  .today-btn {
    flex-shrink: 0; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-ink);
    border-radius: 999px; padding: 0.5rem 0.95rem; font-size: 0.85rem; cursor: pointer;
  }
  .today-btn:hover { background: var(--color-surface-alt); }
  .today-btn:disabled { opacity: 0.5; cursor: default; }
  .date-cal-btn .jh-date { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
  .date-cal-btn .jh-date strong { font-size: 0.88rem; font-weight: 600; }
  .date-cal-btn .icon-slot { width: 18px; height: 18px; color: var(--color-ink-muted); flex-shrink: 0; }
  .date-cal-btn .icon-slot svg { width: 100%; height: 100%; }

  .search-wrap { position: relative; flex: 1 1 200px; min-width: 160px; }
  @media (max-width: 480px) {
    .journal-header-row2 {
      display: flex; align-items: center; gap: 0.5rem; flex: 1 1 100%; width: 100%;
    }
    .search-wrap { flex: 1 1 auto; min-width: 90px; }
    .search-wrap input { padding: 0.4rem 2rem 0.4rem 0.6rem; font-size: 0.78rem; }
    .search-icon-btn { width: 24px; height: 24px; right: 2px; }
    .search-icon-btn svg, .search-icon-btn img { width: 15px; height: 15px; }
    .save-icon-btn { width: 30px; height: 30px; }
    .save-icon-btn svg { width: 16px; height: 16px; }
    .date-cal-btn { padding: 0.35rem 0.5rem; }
    .intro { display: none; }
  }
  .search-wrap input {
    width: 100%; border: 1.5px solid var(--color-border); border-radius: 999px; background: var(--color-surface);
    color: var(--color-ink); padding: 0.5rem 2.4rem 0.5rem 0.9rem; font-size: 0.85rem; font-family: inherit;
  }
  .search-wrap input:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .search-icon-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px;
    border: none; background: none; border-radius: 50%; cursor: pointer; color: var(--color-ink-muted);
    display: flex; align-items: center; justify-content: center;
  }
  .search-icon-btn:hover { background: var(--color-surface-alt); }
  .search-icon-btn svg, .search-icon-btn img { width: 18px; height: 18px; }
  :root[data-retro="true"] .search-icon-btn svg, :root[data-kawaii="true"] .search-icon-btn svg { image-rendering: pixelated; width: 20px; height: 20px; }

  .save-icon-btn {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: var(--color-radius-sm); border: 1.5px solid var(--color-accent);
    background: var(--color-accent); color: var(--color-accent-contrast); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .save-icon-btn:hover { filter: brightness(1.05); }
  .save-icon-btn:disabled { opacity: 0.5; cursor: default; filter: none; }
  .save-icon-btn svg { width: 19px; height: 19px; }
  :root[data-retro="true"] .save-icon-btn svg, :root[data-kawaii="true"] .save-icon-btn svg { image-rendering: pixelated; width: 21px; height: 21px; }
  .save-pulse { position: relative; }
  .save-pulse::after {
    content: "Saved ✓"; position: absolute; top: 110%; right: 0; font-size: 0.68rem; color: var(--color-accent);
    background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--color-radius-sm);
    padding: 0.15rem 0.45rem; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap;
  }
  .save-pulse.show::after { opacity: 1; }

  /* ---- Search results ---- */
  .search-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 15; background: var(--color-surface);
    border: 1.5px solid var(--color-border); border-radius: var(--color-radius); box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    max-height: 260px; overflow-y: auto; display: none; flex-direction: column; padding: 0.35rem;
  }
  .search-results.open { display: flex; }
  .sr-item {
    display: flex; flex-direction: column; gap: 0.1rem; text-align: left; border: none; background: none;
    border-radius: var(--color-radius-sm); padding: 0.5rem 0.6rem; cursor: pointer; color: var(--color-ink);
  }
  .sr-item:hover { background: var(--color-surface-alt); }
  .sr-item .sr-date { font-size: 0.78rem; font-weight: 600; }
  .sr-item .sr-snippet { font-size: 0.72rem; color: var(--color-ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sr-empty { padding: 0.7rem; font-size: 0.78rem; color: var(--color-ink-muted); text-align: center; }

  .intro { font-size: 0.82rem; color: var(--color-ink-muted); line-height: 1.5; margin: 0; }

  /* ---- Journal sheet: one continuous page, no per-question boxes ---- */
  .journal-sheet {
    border: 1px solid var(--color-border); border-radius: var(--color-radius); box-shadow: var(--color-shadow);
    background: var(--color-surface); padding: 0.1rem 1.3rem;
  }
  .prompt-section {
    padding: 1.15rem 0; border-bottom: 1px solid color-mix(in srgb, var(--color-border) 55%, transparent);
    display: flex; flex-direction: column; gap: 0.6rem; transition: border-color 0.15s ease;
  }
  .prompt-section:focus-within { border-bottom-color: var(--color-accent); }
  .prompt-head {
    display: flex; align-items: center; gap: 0.55rem; font-size: 0.9rem; font-weight: 600;
    border-left: 3px solid var(--color-accent); padding-left: 0.65rem;
  }
  .prompt-emoji { font-size: 1rem; }
  .prompt-section textarea, .prompt-section input[type="text"] {
    resize: vertical; min-height: 3em; border: none;
    border-radius: 0; background: transparent; color: var(--color-ink); padding: 0.35rem 0.1rem 0.55rem; font-size: 0.86rem;
    font-family: inherit; line-height: 1.5;
  }
  .prompt-section textarea:focus, .prompt-section input[type="text"]:focus {
    outline: none;
  }
  .prompt-section textarea::placeholder, .prompt-section input::placeholder { color: var(--color-ink-muted); }
  .prompt-section textarea:disabled, .prompt-section input:disabled, .q5-head select:disabled { cursor: default; opacity: 0.55; }

  .q5-head { display: flex; align-items: center; gap: 0.5rem; border-left: 3px solid var(--color-accent); padding-left: 0.65rem; }
  .q5-head select {
    flex: 1; min-width: 0; border: none; border-bottom: 1.5px solid color-mix(in srgb, var(--color-border) 70%, transparent); border-radius: 0;
    background: transparent; color: var(--color-ink); padding: 0.3rem 0.1rem; font-size: 0.9rem; font-family: inherit; font-weight: 600;
  }
  .q5-head select:focus { outline: none; border-bottom-color: var(--color-accent); }
  .q5-head input[type="text"] { flex: 1; min-width: 0; font-weight: 600; min-height: auto; padding: 0.3rem 0.1rem; }
  .q5-head .icon-btn-plain {
    flex-shrink: 0; width: 28px; height: 28px; border: none; background: none; border-radius: 50%;
    cursor: pointer; color: var(--color-ink-muted); font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
  }
  .q5-head .icon-btn-plain:hover { background: var(--color-surface-alt); color: var(--color-accent); }

  /* ---- Notes: checkered paper, same continuous sheet, no boxed input feel ---- */
  .notes-section { padding: 1.15rem 0; display: flex; flex-direction: column; gap: 0.6rem; }
  .notes-textarea {
    min-height: 8em; border: none; border-radius: 0; background-color: transparent;
    background-image:
      linear-gradient(color-mix(in srgb, var(--color-border) 15%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--color-border) 15%, transparent) 1px, transparent 1px);
    background-size: 20px 20px;
    color: var(--color-ink); padding: 0.6rem 0.2rem; font-size: 0.86rem; font-family: inherit; line-height: 20px;
    resize: vertical;
  }
  .notes-textarea:focus { outline: none; }
  .notes-textarea::placeholder { color: var(--color-ink-muted); line-height: 1.45; }

  .footer-note { text-align: center; font-size: 0.78rem; color: var(--color-ink-muted); padding-top: 0.3rem; }

  /* ---- Year view overlay ---- */
  .yv-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 40; display: none;
    align-items: center; justify-content: center; padding: 1rem;
  }
  .yv-overlay.open { display: flex; }
  .yv-card {
    width: 100%; max-width: 820px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; gap: 0.9rem;
    background: var(--color-canvas); border: 1px solid var(--color-border); border-radius: var(--color-radius);
    box-shadow: var(--color-shadow); padding: 1rem;
  }
  .yv-head { display: flex; align-items: center; justify-content: space-between; }
  .yv-year-nav { display: flex; align-items: center; gap: 0.5rem; }
  .yv-year-nav button {
    width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-surface);
    cursor: pointer; color: var(--color-ink); display: flex; align-items: center; justify-content: center;
  }
  .yv-year-nav button:hover { background: var(--color-surface-alt); }
  .yv-year-nav .yv-year-icon { width: 18px; height: 18px; color: var(--color-ink-muted); }
  .yv-year-nav .yv-year-icon svg { width: 100%; height: 100%; }
  .yv-year-label { font-weight: 600; font-size: 1.05rem; }
  .yv-close { border: none; background: none; color: var(--color-ink-muted); font-size: 1.1rem; cursor: pointer; }
  .yv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.7rem; overflow-y: auto; }
  @media (max-width: 480px) { .yv-grid { grid-template-columns: 1fr; } }
  @media (min-width: 560px) { .yv-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 760px) { .yv-grid { grid-template-columns: repeat(4, 1fr); } }
  .yv-month { border: 1px solid var(--color-border); border-radius: var(--color-radius-sm); background: var(--color-surface); padding: 0.5rem; }
  .yv-month h4 { margin: 0 0 0.3rem; text-align: center; font-size: 0.8rem; }
  .yv-month .yv-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  .yv-month .yv-dow { text-align: center; font-size: 0.5rem; color: var(--color-ink-muted); }
  .yv-day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 0.56rem;
    border-radius: 50%; border: none; background: none; cursor: pointer; color: var(--color-ink);
  }
  .yv-day:hover { background: var(--color-surface-alt); }
  .yv-day.muted { color: var(--color-ink-muted); opacity: 0.4; }
  .yv-day.today { color: #e0217a; font-weight: 700; }
  .yv-day.future { opacity: 0.4; }
  .yv-day.has-entry::after { content: ""; display: block; width: 3px; height: 3px; border-radius: 50%; background: var(--color-accent); margin-top: 1px; }
  .yv-day.selected { background: var(--color-accent); color: var(--color-accent-contrast); font-weight: 600; }
  @media (max-width: 480px) {
    .yv-month .yv-dow, .yv-day { font-size: 0.72rem; }
    .yv-month h4 { font-size: 0.88rem; }
  }
</style>
</head>
<body data-retro="false">

<div class="app">
  <div class="journal-header">
    <button type="button" class="today-btn" id="today-btn">Today</button>
    <button type="button" class="date-cal-btn" id="date-cal-btn">
      <span class="jh-date">
        <strong id="date-sub">Thursday, August 13</strong>
      </span>
      <span class="icon-slot" id="cal-icon-slot"></span>
    </button>
    <div class="journal-header-row2">
      <div class="search-wrap" id="search-wrap">
        <input type="text" id="search-input" placeholder="Search by date (2026 or 20.05) or text…" autocomplete="off" />
        <button type="button" class="search-icon-btn" id="search-btn" aria-label="Search"></button>
        <div class="search-results" id="search-results"></div>
      </div>
      <button type="button" class="save-icon-btn" id="save-btn" aria-label="Save entry"></button>
    </div>
  </div>

  <p class="intro">No pressure — fill in what feels right today, skip what doesn't. Big or small, it all counts.</p>

  <div class="journal-sheet">
    <div id="prompt-list"></div>
    <div class="notes-section">
      <div class="prompt-head">📝 Notes</div>
      <textarea class="notes-textarea" id="notes-textarea" placeholder="Anything else on your mind…" rows="5"></textarea>
    </div>
  </div>

  <p class="footer-note" id="footer-note"></p>
</div>

<div class="yv-overlay" id="yv-overlay">
  <div class="yv-card">
    <div class="yv-head">
      <div class="yv-year-nav">
        <button type="button" id="yv-prev-year" aria-label="Previous year">‹</button>
        <span class="yv-year-icon" id="yv-year-icon"></span>
        <span class="yv-year-label" id="yv-year-label">2026</span>
        <button type="button" id="yv-next-year" aria-label="Next year">›</button>
      </div>
      <button type="button" class="yv-close" id="yv-close" aria-label="Close">✕</button>
    </div>
    <div class="yv-grid" id="yv-grid"></div>
  </div>
</div>

<script>
  const THEME_STORAGE_KEY = "me-planner:theme";

  function pixelIcon(bitmap, viewBox) {
    const size = viewBox || 20;
    const cell = size / 8;
    let rects = "";
    bitmap.forEach((row, y) => {
      [...row].forEach((c, x) => { if (c === "1") rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`; });
    });
    return `<svg viewBox="0 0 ${size} ${size}" fill="currentColor">${rects}</svg>`;
  }
  function pixelIconLayers(layers, viewBox) {
    const size = viewBox || 20;
    const cell = size / 8;
    const groups = layers.map(({ grid, color }) => {
      let rects = "";
      grid.forEach((row, y) => { [...row].forEach((c, x) => { if (c === "1") rects += `<rect x="${x * cell}" y="${y * cell}" width="${cell}" height="${cell}"/>`; }); });
      return `<g style="fill:${color}">${rects}</g>`;
    }).join("");
    return `<svg viewBox="0 0 ${size} ${size}">${groups}</svg>`;
  }

  const BUNNY_MAGNIFIER = ["01000010", "01111110", "11111111", "11111111", "11111111", "01111110", "00000011", "00000001"];
  const FLOPPY_BASE = ["11111111", "11111111", "11000011", "11000011", "11111111", "11000011", "11000011", "11111111"];
  const FLOPPY_HEART = ["00000000", "00000000", "00000000", "00000000", "00000000", "00100100", "01111110", "00000000"];
  const CAL_ICON_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="3" y="4.5" width="14" height="12.5" rx="1.5"/><line x1="3" y1="8.5" x2="17" y2="8.5"/><line x1="6.5" y1="2.5" x2="6.5" y2="6"/><line x1="13.5" y1="2.5" x2="13.5" y2="6"/></svg>`;
  const YEAR_ICON_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.2"/><line x1="10" y1="10" x2="10" y2="5.5"/><line x1="10" y1="10" x2="13" y2="12"/></svg>`;
  const DEFAULT_SEARCH_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8.3" cy="8.3" r="5.3"/><line x1="16" y1="16" x2="12.6" y2="12.6"/></svg>`;
  const DEFAULT_SAVE_SVG = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"><path d="M4 3.2h9.2L16 6v10.8a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4.2a1 1 0 0 1 1-1Z"/><path d="M6.6 3.2v4.6h5.8V3.2"/><rect x="6" y="11" width="7" height="4.5"/></svg>`;

  let currentTheme = { retro: false, kawaii: false };

  function renderIcons() {
    const retro = currentTheme.retro && !currentTheme.kawaii;
    const kawaii = currentTheme.kawaii;
    document.getElementById("cal-icon-slot").innerHTML = CAL_ICON_SVG;
    document.getElementById("yv-year-icon").innerHTML = YEAR_ICON_SVG;
    document.getElementById("search-btn").innerHTML = (retro || kawaii) ? pixelIcon(BUNNY_MAGNIFIER) : DEFAULT_SEARCH_SVG;
    if (retro) {
      document.getElementById("save-btn").innerHTML = pixelIcon(FLOPPY_BASE);
    } else if (kawaii) {
      document.getElementById("save-btn").innerHTML = pixelIconLayers([
        { grid: FLOPPY_BASE, color: "currentColor" },
        { grid: FLOPPY_HEART, color: "#ff6fa5" },
      ]);
    } else {
      document.getElementById("save-btn").innerHTML = DEFAULT_SAVE_SVG;
    }
  }

  function applyTheme() {
    const raw = localStorage.getItem(THEME_STORAGE_KEY);
    let theme = { mode: "light", retro: false, kawaii: false };
    if (raw) {
      try { theme = { ...theme, ...JSON.parse(raw) }; } catch {}
    }
    currentTheme = theme;
    const root = document.body;
    root.dataset.retro = theme.retro && !theme.kawaii ? "true" : "false";
    root.dataset.kawaii = theme.kawaii ? "true" : "false";
    const dark = theme.mode === "dark" || (theme.mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const paletteKey = theme.kawaii ? null : (theme.retro ? (dark ? "retroDark" : "retroLight") : (dark ? "dark" : "light"));
    const palette = theme.kawaii
      ? { bg: "#f2ddec", surface: "#fffdfd", text: "#4a3b6b", accent: "#ff6fa5", border: "#ffffff" }
      : (theme.palettes && theme.palettes[paletteKey]);
    if (palette) {
      const s = document.documentElement.style;
      s.setProperty("--color-canvas", palette.bg);
      s.setProperty("--color-surface", palette.surface);
      s.setProperty("--color-ink", palette.text);
      s.setProperty("--color-accent", palette.accent);
      s.setProperty("--color-border", palette.border);
    }
    renderIcons();
  }
  applyTheme();
  window.addEventListener("storage", (e) => { if (e.key === THEME_STORAGE_KEY) applyTheme(); });

  // When embedded on the real /journal route, clicks in here fire in this
  // iframe's own document and never reach the parent window's "click"
  // listener — so the pet bunny gimmick never wakes up. Tell the parent
  // directly instead; it's a no-op if this file is opened standalone.
  if (window.parent !== window) {
    document.addEventListener("click", () => {
      window.parent.postMessage({ type: "me-planner:wake-bunny" }, window.location.origin);
    });
  }

  // ---- Entries: persisted to localStorage (see loadEntries/saveEntries
  // above); seeded with 2 demo entries only on first-ever load. ----
  const STATIC_QUESTIONS = [
    { key: "wentWell", emoji: "☀️", label: "What went well today, why?", placeholder: "Big or small, it counts…" },
    { key: "differently", emoji: "🔄", label: "What will I do differently?", placeholder: "No judgment — just noticing…" },
    { key: "learned", emoji: "💡", label: "What new thing did I learn?", placeholder: "Big idea or tiny fact…" },
    { key: "forSomeone", emoji: "🤝", label: "What did I do for someone else today?", placeholder: "A small kindness counts…" },
  ];
  const Q5_POOL = [
    "What am I grateful for today?",
    "What's one thing I'm proud of today?",
    "What challenged me today, and how did I handle it?",
    "What's one small thing that made today better?",
  ];

  function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
  function keyToDate(k) { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); }
  function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function isToday(d) { return isSameDay(d, new Date()); }
  function isFuture(d) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const dd = new Date(d); dd.setHours(0, 0, 0, 0);
    return dd > t;
  }

  // Same localStorage-as-stand-in-for-SQLite pattern as
  // src/lib/planner/planner-storage.ts — swapping this for the real DB later
  // shouldn't need to touch anything but these two functions.
  const JOURNAL_STORAGE_KEY = "me-planner:journal-entries";

  function seedEntries() {
    const today = new Date();
    const demoDate1 = new Date(today.getFullYear(), today.getMonth(), Math.max(1, today.getDate() - 3));
    const demoDate2 = new Date(today.getFullYear() - 1, 5, 14);
    return {
      [dateKey(demoDate1)]: {
        wentWell: "Finally finished setting up the new desk.",
        differently: "", learned: "", forSomeone: "",
        q5label: Q5_POOL[0], q5text: "A quiet, uneventful evening.",
        notes: "Nothing major, just a steady day.",
      },
      [dateKey(demoDate2)]: {
        wentWell: "Started this journal for the first time.",
        differently: "Would've written a bit more.", learned: "Small notes add up over time.", forSomeone: "",
        q5label: Q5_POOL[2], q5text: "Getting used to a new routine.",
        notes: "",
      },
    };
  }

  function loadEntries() {
    try {
      const raw = localStorage.getItem(JOURNAL_STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return seedEntries();
  }

  function saveEntries() {
    localStorage.setItem(JOURNAL_STORAGE_KEY, JSON.stringify(entries));
  }

  const entries = loadEntries();

  let current = new Date();

  // ---- Header/date ----
  const dateSub = document.getElementById("date-sub");
  const footerNote = document.getElementById("footer-note");

  function renderHeader() {
    dateSub.textContent = current.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    footerNote.textContent = isFuture(current)
      ? "This day hasn't happened yet — come back when it does."
      : isToday(current)
        ? "This is today's page — it'll be here whenever you come back to it."
        : "Viewing a past entry — feel free to add to it any time.";
  }

  // ---- Questions + notes ----
  const promptList = document.getElementById("prompt-list");
  const notesTextarea = document.getElementById("notes-textarea");

  function entryIsEmpty(e) {
    if (!e) return true;
    return !(e.wentWell || e.differently || e.learned || e.forSomeone || (e.q5text || "").trim() || (e.notes || "").trim());
  }

  function commitField(key, field, value) {
    const k = dateKey(current);
    if (!entries[k]) entries[k] = { wentWell: "", differently: "", learned: "", forSomeone: "", q5label: field === "q5label" ? value : Q5_POOL[0], q5text: "", notes: "" };
    entries[k][field] = value;
    if (entryIsEmpty(entries[k])) delete entries[k];
    saveEntries();
    pulseSaved();
  }

  function pulseSaved() {
    const btn = document.getElementById("save-btn");
    btn.classList.add("save-pulse", "show");
    clearTimeout(btn._t);
    btn._t = setTimeout(() => btn.classList.remove("show"), 1400);
  }

  function renderPrompts() {
    const k = dateKey(current);
    const entry = entries[k] || {};
    const locked = isFuture(current);
    promptList.innerHTML = "";

    STATIC_QUESTIONS.forEach((q) => {
      const card = document.createElement("div");
      card.className = "prompt-section";
      card.innerHTML = `
        <div class="prompt-head"><span class="prompt-emoji">${q.emoji}</span><span>${q.label}</span></div>
        <textarea data-field="${q.key}" placeholder="${q.placeholder}" rows="2"></textarea>
      `;
      const ta = card.querySelector("textarea");
      ta.value = entry[q.key] || "";
      ta.disabled = locked;
      ta.addEventListener("blur", () => commitField(k, q.key, ta.value));
      promptList.appendChild(card);
    });

    // Q5: dropdown + pencil, or custom text input
    const q5Card = document.createElement("div");
    q5Card.className = "prompt-section";
    const q5Label = entry.q5label || Q5_POOL[Math.floor(Math.random() * Q5_POOL.length)];
    const isCustom = !Q5_POOL.includes(q5Label);
    q5Card.innerHTML = `
      <div class="q5-head" id="q5-head"></div>
      <textarea data-field="q5text" placeholder="Whatever comes to mind…" rows="2"></textarea>
    `;
    const q5Head = q5Card.querySelector("#q5-head");
    function renderQ5Head(customMode) {
      if (customMode) {
        q5Head.innerHTML = `
          <input type="text" id="q5-custom-input" placeholder="Write your own question…" value="${isCustom ? q5Label.replace(/"/g, "&quot;") : ""}" />
          <button type="button" class="icon-btn-plain" id="q5-list-btn" aria-label="Pick from list">☰</button>
        `;
        const input = q5Head.querySelector("#q5-custom-input");
        input.addEventListener("blur", () => {
          const v = input.value.trim();
          if (v) {
            commitField(k, "q5label", v);
          } else {
            // Left blank — revert to the dropdown showing whatever question was
            // already loaded (q5Label), instead of leaving an empty text field.
            renderQ5Head(false);
          }
        });
        q5Head.querySelector("#q5-list-btn").addEventListener("click", () => renderQ5Head(false));
        if (!locked) input.focus();
      } else {
        const options = Q5_POOL.map((q) => `<option value="${q}" ${q === q5Label ? "selected" : ""}>${q}</option>`).join("");
        q5Head.innerHTML = `
          <select id="q5-select">${options}</select>
          <button type="button" class="icon-btn-plain" id="q5-edit-btn" aria-label="Write your own question">✎</button>
        `;
        q5Head.querySelector("#q5-select").addEventListener("change", (e) => commitField(k, "q5label", e.target.value));
        q5Head.querySelector("#q5-edit-btn").addEventListener("click", () => renderQ5Head(true));
      }
      q5Head.querySelectorAll("select, input, button").forEach((el) => { el.disabled = locked; });
    }
    renderQ5Head(isCustom);
    const q5ta = q5Card.querySelector('textarea[data-field="q5text"]');
    q5ta.value = entry.q5text || "";
    q5ta.disabled = locked;
    q5ta.addEventListener("blur", () => commitField(k, "q5text", q5ta.value));
    promptList.appendChild(q5Card);

    notesTextarea.value = entry.notes || "";
    notesTextarea.disabled = locked;
    document.getElementById("save-btn").disabled = locked;
  }
  notesTextarea.addEventListener("blur", () => commitField(dateKey(current), "notes", notesTextarea.value));

  function render() {
    renderHeader();
    renderPrompts();
  }

  // ---- Save button (explicit save = blur whatever's focused, then pulse) ----
  document.getElementById("save-btn").addEventListener("click", () => {
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    pulseSaved();
  });

  // ---- Search ----
  const searchInput = document.getElementById("search-input");
  const searchResults = document.getElementById("search-results");
  const searchWrap = document.getElementById("search-wrap");

  function entryText(e) {
    return [e.wentWell, e.differently, e.learned, e.forSomeone, e.q5label, e.q5text, e.notes].filter(Boolean).join(" ");
  }

  function runSearch() {
    const q = searchInput.value.trim();
    if (!q) { searchResults.classList.remove("open"); return; }
    const ddmm = q.match(/^(\d{1,2})\.(\d{1,2})\.?$/);
    const yyyy = q.match(/^(\d{4})$/);
    const matches = Object.keys(entries)
      .map((k) => ({ k, date: keyToDate(k), entry: entries[k] }))
      .filter(({ date, entry }) => {
        if (ddmm) return date.getDate() === parseInt(ddmm[1], 10) && date.getMonth() + 1 === parseInt(ddmm[2], 10);
        if (yyyy) return date.getFullYear() === parseInt(yyyy[1], 10);
        return entryText(entry).toLowerCase().includes(q.toLowerCase());
      })
      .sort((a, b) => b.date - a.date);

    if (matches.length === 0) {
      searchResults.innerHTML = `<div class="sr-empty">No matching entries.</div>`;
    } else {
      searchResults.innerHTML = "";
      matches.forEach(({ k, date, entry }) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "sr-item";
        const snippet = entryText(entry).slice(0, 70) || "—";
        btn.innerHTML = `<span class="sr-date">${date.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span><span class="sr-snippet">${snippet}</span>`;
        btn.addEventListener("click", () => { current = date; render(); searchResults.classList.remove("open"); searchInput.value = ""; });
        searchResults.appendChild(btn);
      });
    }
    searchResults.classList.add("open");
  }
  document.getElementById("search-btn").addEventListener("click", runSearch);
  document.addEventListener("click", (e) => { if (!searchWrap.contains(e.target)) searchResults.classList.remove("open"); });
  searchWrap.addEventListener("focusout", (e) => {
    if (searchWrap.contains(e.relatedTarget)) return;
    setTimeout(() => { if (!searchWrap.contains(document.activeElement)) runSearch(); }, 0);
  });
  searchInput.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });

  // ---- Year view ----
  const yvOverlay = document.getElementById("yv-overlay");
  const yvGrid = document.getElementById("yv-grid");
  const yvYearLabel = document.getElementById("yv-year-label");
  let yvYear = current.getFullYear();

  function monthGridDays(year, month) {
    const first = new Date(year, month, 1);
    const startOffset = (first.getDay() + 6) % 7;
    const gridStart = new Date(first);
    gridStart.setDate(gridStart.getDate() - startOffset);
    return Array.from({ length: 42 }, (_, i) => { const d = new Date(gridStart); d.setDate(gridStart.getDate() + i); return d; });
  }

  function renderYearView() {
    yvYearLabel.textContent = yvYear;
    yvGrid.innerHTML = "";
    for (let m = 0; m < 12; m++) {
      const monthEl = document.createElement("div");
      monthEl.className = "yv-month";
      const monthName = new Date(yvYear, m, 1).toLocaleDateString(undefined, { month: "long" });
      const dow = ["M", "T", "W", "T", "F", "S", "S"].map((d) => `<div class="yv-dow">${d}</div>`).join("");
      monthEl.innerHTML = `<h4>${monthName}</h4><div class="yv-days">${dow}</div>`;
      const daysWrap = monthEl.querySelector(".yv-days");
      monthGridDays(yvYear, m).forEach((d) => {
        const muted = d.getMonth() !== m;
        const hasEntry = !!entries[dateKey(d)];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "yv-day" + (muted ? " muted" : "") + (isToday(d) ? " today" : "") + (hasEntry ? " has-entry" : "") + (isSameDay(d, current) ? " selected" : "") + (isFuture(d) ? " future" : "");
        btn.textContent = d.getDate();
        btn.addEventListener("click", () => { current = d; render(); yvOverlay.classList.remove("open"); });
        daysWrap.appendChild(btn);
      });
      yvGrid.appendChild(monthEl);
    }
  }
  document.getElementById("today-btn").addEventListener("click", () => { current = new Date(); render(); });
  document.getElementById("date-cal-btn").addEventListener("click", () => { yvYear = current.getFullYear(); renderYearView(); yvOverlay.classList.add("open"); });
  document.getElementById("yv-close").addEventListener("click", () => yvOverlay.classList.remove("open"));
  yvOverlay.addEventListener("click", (e) => { if (e.target === yvOverlay) yvOverlay.classList.remove("open"); });
  document.getElementById("yv-prev-year").addEventListener("click", () => { yvYear--; renderYearView(); });
  document.getElementById("yv-next-year").addEventListener("click", () => { yvYear++; renderYearView(); });

  render();
</script>
</body>
</html>
